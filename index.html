<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura de Mujer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
        }

.presentacion {
    width: 100%;
    height: 100vh;
    position: relative;
}

.presentacion img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.boton-instagram {
    position: absolute;

    left: 43.5%;
    top: 77%;

    width: 13%;
    height: 8%;

    cursor: pointer;
}

        /* CATÁLOGO */
        .catalogo {
            padding: 60px 30px;
            text-align: center;
        }

        .catalogo h2 {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .producto {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .producto img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .producto h3 {
            margin: 15px;
        }

        .producto p {
            margin-bottom: 20px;
        }

        /* CELULAR */
@media (max-width: 600px) {

    .presentacion {
        height: auto;
    }

    .presentacion img {
        width: 100%;
        height: auto;
        object-fit: contain;
    }

}

    </style>
</head>

<body>

    <!-- PRESENTACIÓN -->

<section class="presentacion">

    <img src="img/1.jpg">

    <a 
        href="https://www.instagram.com/aura_de_mujer_mx/"
        target="_blank"
        class="boton-instagram">
    </a>

</section>

    <!-- CATÁLOGO -->

    <section class="catalogo">

        <h2>Catálogo</h2>

        <div class="productos">

            <div class="producto">

                <img src="img/2.jpg">

                <h3>Maquillaje</h3>

                <p>click aqui</p>

            </div>


            <div class="producto">

                <img src="img/3.jpg">

                <h3>Accesorios</h3>

                <p>click aqui</p>

            </div>


            <div class="producto">

                <img src="img/4.jpg">

                <h3>Regalos</h3>

                <p>click aqui</p>

            </div>

        </div>

    </section>

</body>

</html>
